<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonaXP Admin - Gestão de Jogos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 16px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: #fff;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .logo { font-size: 1.3rem; font-weight: 700; color: #4f46e5; }
        .back-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-add {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .form-card {
            background: #fff;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: none;
        }
        .form-card.ativo { display: block; }
        .form-card h3 { margin-bottom: 20px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group.full { grid-column: 1/-1; }
        .form-group label { font-size: 0.75rem; color: #64748b; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            padding: 10px 14px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #1e293b;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }
        .form-group.checkbox {
            flex-direction: row;
            align-items: center;
            gap: 8px;
        }
        .form-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
        }
        .btn-salvar {
            background: #4f46e5;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-cancelar {
            background: #f1f5f9;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
        }
        .lista { display: flex; flex-direction: column; gap: 10px; }
        .item {
            background: #fff;
            border-radius: 14px;
            padding: 15px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #4f46e5;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .item.destaque { border-left-color: #f59e0b; }
        .item .info { flex: 1; min-width: 150px; }
        .item .info h4 { font-size: 0.95rem; margin-bottom: 4px; }
        .item .info p { font-size: 0.75rem; color: #94a3b8; }
        .item .acoes { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-acao {
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .btn-editar { background: #dbeafe; color: #2563eb; }
        .btn-excluir { background: #fee2e2; color: #ef4444; }
        .btn-destaque { background: #fef3c7; color: #f59e0b; }
        .vazio { text-align: center; padding: 40px; color: #94a3b8; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: bold;
            z-index: 1000;
            display: none;
        }
        .toast.ativo { display: block; }
        .toast.erro { background: #ef4444; }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">📝 Gestão de Jogos</div>
        <a href="dashboard.html" class="back-btn">← Voltar</a>
    </div>

    <button class="btn-add" onclick="abrirForm()">➕ Adicionar Jogo</button>

    <div class="form-card" id="formCard">
        <h3 id="formTitulo">➕ Adicionar Jogo</h3>
        <div class="form-grid">
            <div class="form-group full">
                <label>🖼️ Imagem (URL)</label>
                <input type="text" id="jogoImagem" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Nome *</label>
                <input type="text" id="jogoNome" placeholder="Ex: Max Payne">
            </div>
            <div class="form-group">
                <label>Categoria *</label>
                <input type="text" id="jogoCategoria" placeholder="Ex: Ação">
            </div>
            <div class="form-group">
                <label>Plataforma</label>
                <select id="jogoPlataforma">
                    <option value="PSP">PSP</option>
                    <option value="PS2">PS2</option>
                    <option value="PC">PC</option>
                    <option value="APK Android">APK Android</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tamanho</label>
                <input type="text" id="jogoTamanho" placeholder="Ex: 1.4 GB">
            </div>
            <div class="form-group">
                <label>Tipo</label>
                <select id="jogoPago">
                    <option value="false">Grátis</option>
                    <option value="true">Pago</option>
                </select>
            </div>
            <div class="form-group">
                <label>Preço</label>
                <input type="text" id="jogoPreco" placeholder="25 MT">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="text" id="jogoSenha" placeholder="Opcional">
            </div>
            <div class="form-group full">
                <label>Link de Download</label>
                <input type="text" id="jogoDownload" placeholder="https://...">
            </div>
            <div class="form-group full">
                <label>Descrição Curta</label>
                <input type="text" id="jogoDescricao" placeholder="Descrição resumida">
            </div>
            <div class="form-group full">
                <label>Descrição Longa</label>
                <textarea id="jogoDescricaoLonga" rows="3" placeholder="Descrição detalhada"></textarea>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="jogoDestaque">
                <label>⭐ Destaque</label>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="jogoBanner">
                <label>🎪 Banner</label>
            </div>
            <div class="form-group checkbox">
                <input type="checkbox" id="jogoPartilha">
                <label>📤 Exigir partilha antes de baixar</label>
            </div>
            <div class="form-group">
                <label>Nº de partilhas necessárias</label>
                <input type="number" id="jogoPartilhasNum" placeholder="Ex: 5" min="1" value="5">
            </div>
        </div>
        <div class="form-buttons">
            <button class="btn-cancelar" onclick="fecharForm()">Cancelar</button>
            <button class="btn-salvar" onclick="salvarJogo()">💾 Guardar</button>
        </div>
    </div>

    <div class="lista" id="listaJogos"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API_URL = 'https://zona-backend-v3h1.onrender.com';

    if (localStorage.getItem('adminLogado') !== 'true') {
        window.location.href = 'index.html';
    }

    let jogosData = [];
    let jogoEditandoId = null;

    function mostrarToast(msg, erro = false) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast ativo' + (erro ? ' erro' : '');
        setTimeout(() => t.className = 'toast', 3000);
    }

    async function carregarJogos() {
        try {
            const res = await fetch(API_URL + '/api/jogos');
            const data = await res.json();
            jogosData = data.jogos || [];
            renderizar();
        } catch (e) {
            mostrarToast('Erro ao carregar jogos', true);
        }
    }

    function renderizar() {
        const lista = document.getElementById('listaJogos');
        if (jogosData.length === 0) {
            lista.innerHTML = '<div class="vazio">Nenhum jogo registado</div>';
            return;
        }
        lista.innerHTML = '';
        jogosData.forEach(jogo => {
            const div = document.createElement('div');
            div.className = 'item' + (jogo.destaque ? ' destaque' : '');
            div.innerHTML = `
                <div class="info">
                    <h4>${jogo.nome}</h4>
                    <p>${jogo.categoria} • ${jogo.plataforma} • ${jogo.pago ? '💰 ' + jogo.preco : '🎁 Grátis'}${jogo.partilha_ativa ? ' • 📤 Partilha' : ''}</p>
                </div>
                <div class="acoes">
                    <button class="btn-acao btn-editar" onclick="editarJogo(${jogo.id})">✏️ Editar</button>
                    <button class="btn-acao btn-destaque" onclick="toggleDestaque(${jogo.id})">${jogo.destaque ? '⭐ Remover' : '☆ Destacar'}</button>
                    <button class="btn-acao btn-excluir" onclick="excluirJogo(${jogo.id})">🗑️</button>
                </div>
            `;
            lista.appendChild(div);
        });
    }

    function abrirForm(jogo = null) {
        document.getElementById('formCard').classList.add('ativo');
        jogoEditandoId = null;

        if (jogo) {
            jogoEditandoId = jogo.id;
            document.getElementById('formTitulo').textContent = '✏️ Editar Jogo';
            document.getElementById('jogoNome').value = jogo.nome || '';
            document.getElementById('jogoCategoria').value = jogo.categoria || '';
            document.getElementById('jogoPlataforma').value = jogo.plataforma || 'PSP';
            document.getElementById('jogoImagem').value = jogo.imagem || '';
            document.getElementById('jogoTamanho').value = jogo.tamanho || '';
            document.getElementById('jogoPago').value = jogo.pago ? 'true' : 'false';
            document.getElementById('jogoPreco').value = jogo.preco || '';
            document.getElementById('jogoSenha').value = jogo.senha || '';
            document.getElementById('jogoDownload').value = jogo.download || '';
            document.getElementById('jogoDescricao').value = jogo.descricao_curta || '';
            document.getElementById('jogoDescricaoLonga').value = jogo.descricao_longa || '';
            document.getElementById('jogoDestaque').checked = jogo.destaque || false;
            document.getElementById('jogoBanner').checked = jogo.banner || false;
            document.getElementById('jogoPartilha').checked = jogo.partilha_ativa || false;
            document.getElementById('jogoPartilhasNum').value = jogo.partilhas_necessarias || 5;
        } else {
            document.getElementById('formTitulo').textContent = '➕ Adicionar Jogo';
            document.getElementById('jogoNome').value = '';
            document.getElementById('jogoCategoria').value = '';
            document.getElementById('jogoPlataforma').value = 'PSP';
            document.getElementById('jogoImagem').value = '';
            document.getElementById('jogoTamanho').value = '';
            document.getElementById('jogoPago').value = 'false';
            document.getElementById('jogoPreco').value = '';
            document.getElementById('jogoSenha').value = '';
            document.getElementById('jogoDownload').value = '';
            document.getElementById('jogoDescricao').value = '';
            document.getElementById('jogoDescricaoLonga').value = '';
            document.getElementById('jogoDestaque').checked = false;
            document.getElementById('jogoBanner').checked = false;
            document.getElementById('jogoPartilha').checked = false;
            document.getElementById('jogoPartilhasNum').value = 5;
        }
        document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    }

    function fecharForm() {
        document.getElementById('formCard').classList.remove('ativo');
        jogoEditandoId = null;
    }

    async function salvarJogo() {
        const jogo = {
            nome: document.getElementById('jogoNome').value.trim(),
            categoria: document.getElementById('jogoCategoria').value.trim(),
            plataforma: document.getElementById('jogoPlataforma').value,
            imagem: document.getElementById('jogoImagem').value.trim(),
            tamanho: document.getElementById('jogoTamanho').value.trim(),
            pago: document.getElementById('jogoPago').value === 'true',
            preco: document.getElementById('jogoPreco').value.trim(),
            senha: document.getElementById('jogoSenha').value.trim(),
            download: document.getElementById('jogoDownload').value.trim(),
            descricao_curta: document.getElementById('jogoDescricao').value.trim(),
            descricao_longa: document.getElementById('jogoDescricaoLonga').value.trim(),
            destaque: document.getElementById('jogoDestaque').checked,
            banner: document.getElementById('jogoBanner').checked,
            partilha_ativa: document.getElementById('jogoPartilha').checked,
            partilhas_necessarias: parseInt(document.getElementById('jogoPartilhasNum').value) || 0,
            likes: 0,
            dislikes: 0
        };

        if (!jogo.nome || !jogo.categoria) {
            mostrarToast('Preencha nome e categoria!', true);
            return;
        }

        try {
            const url = jogoEditandoId ? `${API_URL}/api/jogos/${jogoEditandoId}` : `${API_URL}/api/jogos`;
            const method = jogoEditandoId ? 'PUT' : 'POST';

            if (jogoEditandoId) {
                const existente = jogosData.find(j => j.id === jogoEditandoId);
                if (existente) {
                    jogo.likes = existente.likes || 0;
                    jogo.dislikes = existente.dislikes || 0;
                }
            }

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(jogo)
            });

            if (res.ok) {
                mostrarToast(jogoEditandoId ? '✅ Jogo atualizado!' : '✅ Jogo adicionado!');
                fecharForm();
                await carregarJogos();
            } else {
                mostrarToast('Erro ao guardar', true);
            }
        } catch (e) {
            mostrarToast('Erro de conexão', true);
        }
    }

    function editarJogo(id) {
        const jogo = jogosData.find(j => j.id === id);
        if (jogo) abrirForm(jogo);
    }

    async function toggleDestaque(id) {
        const jogo = jogosData.find(j => j.id === id);
        if (!jogo) return;
        try {
            await fetch(`${API_URL}/api/jogos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ...jogo, destaque: !jogo.destaque })
            });
            await carregarJogos();
            mostrarToast(jogo.destaque ? 'Removido do destaque' : 'Adicionado ao destaque');
        } catch (e) {
            mostrarToast('Erro', true);
        }
    }

    async function excluirJogo(id) {
        if (!confirm('Excluir este jogo?')) return;
        try {
            await fetch(`${API_URL}/api/jogos/${id}`, { method: 'DELETE' });
            await carregarJogos();
            mostrarToast('Jogo excluído');
        } catch (e) {
            mostrarToast('Erro', true);
        }
    }

    carregarJogos();
</script>

</body>
</html>
