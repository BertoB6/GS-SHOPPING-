<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonaXP Admin - Mensagens</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 16px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            background: #fff;
            border-radius: 20px;
            padding: 20px 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .logo { font-size: 1.3rem; font-weight: 700; color: #4f46e5; }
        .back-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
        }
        .lista { display: flex; flex-direction: column; gap: 10px; }
        .conversa {
            background: #fff;
            border-radius: 14px;
            padding: 15px 18px;
            border-left: 4px solid #4f46e5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: 0.2s;
        }
        .conversa.nao-lida {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .conversa:hover { background: #f8fafc; }
        .conversa .topo {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .conversa .nome { font-weight: 600; font-size: 0.9rem; }
        .conversa .data { font-size: 0.7rem; color: #94a3b8; }
        .conversa .ultima-msg {
            font-size: 0.8rem;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .chat-box h3 { margin-bottom: 15px; color: #4f46e5; }
        .chat-mensagens {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8fafc;
            border-radius: 12px;
        }
        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .msg.utilizador { background: #dbeafe; color: #1e293b; align-self: flex-start; }
        .msg.admin { background: #4f46e5; color: white; align-self: flex-end; }
        .msg .hora { display: block; font-size: 0.65rem; opacity: 0.7; margin-top: 4px; }
        .chat-input { display: flex; gap: 10px; }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.9rem;
            color: #1e293b;
        }
        .chat-input input:focus { outline: none; border-color: #4f46e5; }
        .chat-input button {
            padding: 12px 24px;
            background: #4f46e5;
            border: none;
            border-radius: 30px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        .voltar-chat {
            background: #f1f5f9;
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            color: #475569;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .vazio { text-align: center; padding: 40px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo">💬 Mensagens</div>
        <a href="dashboard.html" class="back-btn">← Voltar</a>
    </div>

    <div id="conteudo"></div>
</div>

<script>
    const API_URL = 'https://zona-backend-v3h1.onrender.com';

    if (localStorage.getItem('adminLogado') !== 'true') {
        window.location.href = 'index.html';
    }

    let mensagensData = [];
    let conversaAtualId = null;

    async function carregarMensagens() {
        try {
            const res = await fetch(API_URL + '/api/mensagens/admin/todas');
            const data = await res.json();
            mensagensData = data.conversas || [];
            renderizarConversas();
        } catch (e) {
            document.getElementById('conteudo').innerHTML = '<div class="vazio">Erro ao carregar mensagens</div>';
        }
    }

    function renderizarConversas() {
        const conteudo = document.getElementById('conteudo');
        
        if (mensagensData.length === 0) {
            conteudo.innerHTML = '<div class="vazio">Nenhuma conversa iniciada</div>';
            return;
        }

        conteudo.innerHTML = '<div class="lista" id="listaConversas"></div>';
        const lista = document.getElementById('listaConversas');

        mensagensData.forEach(conv => {
            const naoLida = conv.mensagens && conv.mensagens.some(m => m.de === 'utilizador' && m.lida === false);
            const ultimaMsg = conv.mensagens && conv.mensagens.length > 0 
                ? conv.mensagens[conv.mensagens.length - 1] 
                : null;

            const div = document.createElement('div');
            div.className = 'conversa' + (naoLida ? ' nao-lida' : '');
            div.onclick = () => abrirConversa(conv.id);
            div.innerHTML = `
                <div class="topo">
                    <span class="nome">${conv.utilizadorNome}</span>
                    <span class="data">${ultimaMsg ? new Date(ultimaMsg.data).toLocaleString('pt-PT') : ''}</span>
                </div>
                <div class="ultima-msg">${ultimaMsg ? ultimaMsg.texto : 'Sem mensagens'}</div>
            `;
            lista.appendChild(div);
        });
    }

    function abrirConversa(id) {
        conversaAtualId = id;
        const conv = mensagensData.find(c => c.id === id);
        if (!conv) return;

        const conteudo = document.getElementById('conteudo');
        conteudo.innerHTML = `
            <button class="voltar-chat" onclick="fecharConversa()">← Voltar às conversas</button>
            <div class="chat-box">
                <h3>💬 ${conv.utilizadorNome} (${conv.utilizadorWhatsapp})</h3>
                <div class="chat-mensagens" id="chatMensagens"></div>
                <div class="chat-input">
                    <input type="text" id="chatInput" placeholder="Escreve a resposta..." onkeypress="if(event.key==='Enter') responder()">
                    <button onclick="responder()">➤</button>
                </div>
            </div>
        `;

        renderizarChat(conv);
    }

    function renderizarChat(conv) {
        const chatDiv = document.getElementById('chatMensagens');
        if (!chatDiv) return;

        chatDiv.innerHTML = '';
        conv.mensagens.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg ' + msg.de;
            const hora = new Date(msg.data).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${msg.texto}<span class="hora">${hora}</span>`;
            chatDiv.appendChild(div);
        });
        chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function fecharConversa() {
        conversaAtualId = null;
        renderizarConversas();
    }

    async function responder() {
        const input = document.getElementById('chatInput');
        const texto = input.value.trim();
        if (!texto || !conversaAtualId) return;

        try {
            const res = await fetch(`${API_URL}/api/mensagens/${conversaAtualId}/responder`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto })
            });

            if (res.ok) {
                input.value = '';
                await carregarMensagens();
                const conv = mensagensData.find(c => c.id === conversaAtualId);
                if (conv) renderizarChat(conv);
            }
        } catch (e) {
            console.error(e);
        }
    }

    carregarMensagens();
</script>

</body>
</html>
