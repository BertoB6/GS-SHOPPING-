<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZonaXP Admin - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-box {
            background: #111;
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #ff004f;
        }
        .logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff004f, #8000ff, #00ff9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        p {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 14px;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: #ff004f; }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff004f, #8000ff);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }
        button:hover { transform: scale(1.02); }
        .erro {
            color: #ff004f;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="login-box">
    <div class="logo">🎮 ZonaXP Admin</div>
    <p>Painel Administrativo</p>
    <input type="password" id="senha" placeholder="Senha de administrador" onkeypress="if(event.key==='Enter') entrar()">
    <button onclick="entrar()">Entrar</button>
    <div class="erro" id="erro">Senha incorreta</div>
</div>

<script>
    const ADMIN_PASS = 'ZonaXP';

    function entrar() {
        const senha = document.getElementById('senha').value;
        if (senha === ADMIN_PASS) {
            localStorage.setItem('adminLogado', 'true');
            window.location.href = 'dashboard.html';
        } else {
            const erro = document.getElementById('erro');
            erro.style.display = 'block';
            setTimeout(() => erro.style.display = 'none', 3000);
        }
    }
</script>

</body>
</html>
